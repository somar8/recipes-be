spring.application.name=recipes

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:recipesdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER:somardahdal}
spring.datasource.password=${PGPASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:recipes-app-secret-key-that-is-at-least-32-characters-long}
jwt.expiration-ms=86400000