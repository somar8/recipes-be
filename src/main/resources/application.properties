spring.application.name=recipes

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/recipesdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=somardahdal
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=recipes-app-secret-key-that-is-at-least-32-characters-long
jwt.expiration-ms=86400000